<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Sale red on prices only; success and info for state and member callouts" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px}.lbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.grid{display:flex;gap:8px}.sw{flex:1}.chip{height:56px;margin-bottom:8px}.nm{font-size:12px;font-weight:500;color:var(--ink)}.hex{font-size:12px;color:var(--mute);font-weight:500}</style>
</head><body><div class="grid"><div class="sw"><div class="chip" style="background:#d30005;"></div><div class="nm">Sale</div><div class="hex">#d30005</div><div class="lbl">prices only</div></div><div class="sw"><div class="chip" style="background:#780700;"></div><div class="nm">Sale Deep</div><div class="hex">#780700</div><div class="lbl">pressed</div></div><div class="sw"><div class="chip" style="background:#007d48;"></div><div class="nm">Success</div><div class="hex">#007d48</div></div><div class="sw"><div class="chip" style="background:#1eaa52;"></div><div class="nm">Success Bright</div><div class="hex">#1eaa52</div><div class="lbl">on dark</div></div><div class="sw"><div class="chip" style="background:#1151ff;"></div><div class="nm">Info</div><div class="hex">#1151ff</div></div><div class="sw"><div class="chip" style="background:#0034e3;"></div><div class="nm">Info Deep</div><div class="hex">#0034e3</div><div class="lbl">pressed</div></div></div></body></html>
