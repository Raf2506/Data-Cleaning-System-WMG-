<!-- @dsCard group="Shape" viewport="700x180" name="Elevation" subtitle="No drop shadows: flat, 1px hairline divider, or inset bottom line" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px}.lbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.row{padding:14px 0;font-size:12px;font-weight:500;color:var(--mute)}.flat{background:var(--canvas)}.div{border-bottom:1px solid var(--hairline)}.ins{box-shadow:inset 0 -1px 0 var(--hairline-soft)}</style>
</head><body><div class="row flat">Level 0 — flat. Cards, buttons, sections. The dominant treatment.</div>
<div class="row div">Level 1 — 1px hairline divider (#cacacb). Filter rows, footer, PDP rows.</div>
<div class="row ins">Level 2 — inset 0 -1px 0 hairline-soft (#e5e5e5). Sticky bars, tab strips.</div></body></html>
