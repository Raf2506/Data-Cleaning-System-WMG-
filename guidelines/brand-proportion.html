<!-- @dsCard group="Brand" viewport="700x140" name="Palette proportion" subtitle="Roughly how much of a page each colour is allowed to occupy" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px}.lbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.bar{display:flex;height:64px}.seg{display:flex;align-items:flex-end;padding:6px 8px;font-size:9px;letter-spacing:.06em;text-transform:uppercase}</style>
</head><body><div class="bar">
<div class="seg" style="flex:60;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--hairline);color:var(--mute)">Canvas 60%</div>
<div class="seg" style="flex:25;background:var(--soft-cloud);color:var(--mute)">Soft cloud 25%</div>
<div class="seg" style="flex:12;background:var(--ink);color:var(--stone)">Ink 12%</div>
<div class="seg" style="flex:3;background:var(--sale);color:#fff">Sale 3%</div></div></body></html>
