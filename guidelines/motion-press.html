<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px}.lbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.r{display:flex;gap:32px;align-items:center}.pill{background:var(--ink);color:#fff;border-radius:30px;padding:16px 32px;font-size:16px;font-weight:500;display:inline-flex}</style>
</head><body><div class="r"><div><div class="lbl" style="margin-bottom:8px">Default</div><div class="pill">Notify Me</div></div>
<div><div class="lbl" style="margin-bottom:8px">Pressed</div><div style="height:48px;display:flex;align-items:center"><div class="pill" style="transform:scale(.5);opacity:.5;transform-origin:left center">Notify Me</div></div></div></div></body></html>
