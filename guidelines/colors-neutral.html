<!-- @dsCard group="Colors" viewport="700x150" name="Neutral core" subtitle="Ink, canvas and the single surface gray carry ~95% of the chrome" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px}.lbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.grid{display:flex;gap:8px}.sw{flex:1}.chip{height:56px;margin-bottom:8px}.nm{font-size:12px;font-weight:500;color:var(--ink)}.hex{font-size:12px;color:var(--mute);font-weight:500}</style>
</head><body><div class="grid"><div class="sw"><div class="chip" style="background:#111111;"></div><div class="nm">Ink</div><div class="hex">#111111</div></div><div class="sw"><div class="chip" style="background:#ffffff;box-shadow:inset 0 0 0 1px var(--hairline)"></div><div class="nm">Canvas</div><div class="hex">#ffffff</div></div><div class="sw"><div class="chip" style="background:#f5f5f5;box-shadow:inset 0 0 0 1px var(--hairline)"></div><div class="nm">Soft Cloud</div><div class="hex">#f5f5f5</div></div><div class="sw"><div class="chip" style="background:#cacacb;box-shadow:inset 0 0 0 1px var(--hairline)"></div><div class="nm">Hairline</div><div class="hex">#cacacb</div></div><div class="sw"><div class="chip" style="background:#e5e5e5;box-shadow:inset 0 0 0 1px var(--hairline)"></div><div class="nm">Hairline Soft</div><div class="hex">#e5e5e5</div></div></div></body></html>
