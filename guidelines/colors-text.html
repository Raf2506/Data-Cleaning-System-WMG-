<!-- @dsCard group="Colors" viewport="700x180" name="Text ramp" subtitle="Ink → charcoal → ash → mute → stone, high to low emphasis" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px 22px}.lbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.row{display:flex;flex-direction:column;gap:6px}.line{display:flex;align-items:baseline;gap:12px;font-size:16px;font-weight:500}.hex{font-size:12px;color:var(--mute);font-weight:500;margin-left:auto}</style>
</head><body><div class="row">
<div class="line" style="color:var(--ink)">Ink — headlines, product names, prices<span class="hex">#111111</span></div>
<div class="line" style="color:var(--charcoal)">Charcoal — softer body copy<span class="hex">#39393b</span></div>
<div class="line" style="color:var(--ash)">Ash — low-emphasis utility text<span class="hex">#4b4b4d</span></div>
<div class="line" style="color:var(--mute)">Mute — category subtitles, footer links<span class="hex">#707072</span></div>
<div class="line" style="color:var(--stone)">Stone — inverse secondary, lowest emphasis<span class="hex">#9e9ea0</span></div></div></body></html>
