<!-- @startingPoint section="Data tools" subtitle="Invoice cleaning & reporting web app — five screens, click-through" viewport="1440x900" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Clean Sight</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script type="text/babel" src="AppChrome.jsx"></script>
<script type="text/babel" src="Charts.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="UploadScreen.jsx"></script>
<script type="text/babel" src="MappingScreen.jsx"></script>
<script type="text/babel" src="TableScreen.jsx"></script>
<script type="text/babel" src="ReportsScreen.jsx"></script>
<script type="text/babel" src="TreeScreen.jsx"></script>
<style>
body{font-family:Archivo,sans-serif;background:var(--canvas)}
h1,h2,h3{font-family:'Archivo Narrow',Archivo,sans-serif}
a{color:var(--ink)}a:hover{color:var(--charcoal)}
::selection{background:var(--ink);color:var(--canvas)}

/* --- Interactivity: everything clickable gives feedback before the click --- */
button,a,select,[data-click]{transition:background .14s ease,color .14s ease,transform .12s ease,box-shadow .14s ease,filter .14s ease,border-color .14s ease}
button:not(:disabled):active,[data-click]:active{transform:translateY(1px)}

/* Cards and panels that navigate lift on hover */
.lift{cursor:pointer}
.lift:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(17,17,17,.14)}

/* Pill / ghost buttons brighten and lift slightly */
.hoverable:hover{filter:brightness(.94)}

/* Bar rows: the fill brightens and the row tints when the pointer is over it */
.barrow:hover{background:var(--soft-cloud)}
.barrow:hover .barfill{filter:brightness(1.15) saturate(1.12)}
.colbar:hover .colfill{filter:brightness(1.18) saturate(1.12)}

/* Colourful, legible tables: zebra striping + a clear hover row */
table.grid tbody tr:nth-child(even){background:color-mix(in srgb,var(--soft-cloud) 55%,transparent)}
table.grid tbody tr{transition:background .12s ease}
table.grid tbody tr:hover{background:color-mix(in srgb,var(--info,#0a7281) 10%,var(--canvas))}
table.grid tbody td{border-bottom:1px solid var(--hairline-soft)}

/* Tree nodes and list buttons */
.node:hover{background:var(--soft-cloud)!important}
.node:hover .barfill{filter:brightness(1.15) saturate(1.1)}

/* Sidebar navigation, stat cards, quick links */
.navitem:hover{background:rgba(255,255,255,.10)}
.statcard{transition:box-shadow .16s ease,transform .12s ease}
.statcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(17,17,17,.12)}
.golink:hover{background:var(--soft-cloud)!important;padding-left:28px!important}
</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
function App(){
  const [view,setView]=React.useState("dashboard");
  // Bumped whenever live data replaces what the screens are holding.
  const [rev,setRev]=React.useState(0);
  const refresh=()=>setRev(r=>r+1);
  const go=(v)=>{setView(v);window.scrollTo(0,0);};
  const unmapped=(window.INVOICE.codes||[]).filter(c=>c.dropped).length;
  return (<div style={{display:"flex",minHeight:"100vh",alignItems:"stretch"}}>
    <Sidebar view={view} onNavigate={go} unmapped={unmapped}/>
    <main style={{flex:1,minWidth:0,padding:"32px 40px 64px"}}>
      <SourceBanner onNavigate={go}/>
      {view==="dashboard" && <DashboardScreen key={rev} onNavigate={go}/>}
      {/* Not keyed on rev — remounting would wipe the upload it just finished. */}
      {view==="upload" && <UploadScreen onNavigate={go} onCleaned={refresh}/>}
      {/* Also unkeyed: it holds the edits and the save confirmation. */}
      {view==="mapping" && <MappingScreen onSaved={refresh}/>}
      {view==="table" && <TableScreen key={rev}/>}
      {view==="reports" && <ReportsScreen key={rev}/>}
      {view==="tree" && <TreeScreen key={rev}/>}
    </main>
  </div>);
}

// A render error blanks a React app; this boundary turns it into a message the
// user can recover from instead of a crashed tab.
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(err){ return {err}; }
  componentDidCatch(err){ console.error("[app] render error:", err); }
  render(){
    if(!this.state.err) return this.props.children;
    return (
      <div style={{maxWidth:560,margin:"80px auto",padding:"32px",border:"1px solid var(--hairline)",fontFamily:"Archivo,sans-serif"}}>
        <div style={{fontSize:20,fontWeight:600,marginBottom:8}}>Something went wrong</div>
        <div style={{fontSize:14,color:"var(--mute)",lineHeight:1.6,marginBottom:16}}>
          The page hit an error. Your saved mappings are safe — reload to continue and re-upload your file.
        </div>
        <div style={{fontSize:12,fontFamily:"ui-monospace,monospace",color:"var(--sale)",marginBottom:16,wordBreak:"break-word"}}>{String(this.state.err && (this.state.err.message||this.state.err))}</div>
        <button onClick={()=>window.location.reload()} style={{padding:"10px 18px",background:"var(--ink)",color:"var(--canvas)",border:"none",cursor:"pointer",fontFamily:"Archivo,sans-serif",fontSize:14,fontWeight:600}}>Reload</button>
      </div>
    );
  }
}

// Start empty on every page load: clear any stored data so the app shows zeros
// until a file is uploaded this session.
window.API.boot({fresh:true}).then(()=>{
  ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
});
</script></body></html>
