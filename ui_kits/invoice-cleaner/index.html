<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Invoice Cleaning &amp; Reporting</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>
<script type="text/babel" src="AppChrome.jsx"></script>
<script type="text/babel" src="Charts.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="UploadScreen.jsx"></script>
<script type="text/babel" src="MappingScreen.jsx"></script>
<script type="text/babel" src="TableScreen.jsx"></script>
<script type="text/babel" src="ReportsScreen.jsx"></script>
<script type="text/babel" src="TreeScreen.jsx"></script>
<style>body{font-family:Archivo,sans-serif;background:var(--canvas)}h1,h2,h3{font-family:'Archivo Narrow',Archivo,sans-serif}a{color:var(--ink)}a:hover{color:var(--charcoal)}::selection{background:var(--ink);color:var(--canvas)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
function App(){
  const [view,setView]=React.useState("dashboard");
  // Bumped whenever live data replaces what the screens are holding.
  const [rev,setRev]=React.useState(0);
  const refresh=()=>setRev(r=>r+1);
  const go=(v)=>{setView(v);window.scrollTo(0,0);};
  const unmapped=(window.INVOICE.unresolved||[]).length;
  return (<div style={{display:"flex",minHeight:"100vh",alignItems:"stretch"}}>
    <Sidebar view={view} onNavigate={go} unmapped={unmapped}/>
    <main style={{flex:1,minWidth:0,padding:"32px 40px 64px"}}>
      <SourceBanner onNavigate={go}/>
      {view==="dashboard" && <DashboardScreen key={rev} onNavigate={go}/>}
      {/* Not keyed on rev — remounting would wipe the upload it just finished. */}
      {view==="upload" && <UploadScreen onNavigate={go} onCleaned={refresh}/>}
      {/* Also unkeyed: it holds the edits and the save confirmation. */}
      {view==="mapping" && <MappingScreen onSaved={refresh}/>}
      {view==="table" && <TableScreen key={rev}/>}
      {view==="reports" && <ReportsScreen key={rev}/>}
      {view==="tree" && <TreeScreen key={rev}/>}
    </main>
  </div>);
}

// Hydrate from the API before first paint so no screen flashes sample data as
// though it were real. Falls back to data.js when the API is unreachable.
window.API.boot().then(()=>{
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
});
</script></body></html>
