<!-- @startingPoint section="Storefront" subtitle="Full commerce storefront: landing, listing, PDP, membership" viewport="1440x900" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Subtle Gradient — Storefront UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ListingScreen.jsx"></script>
<script type="text/babel" src="ProductScreen.jsx"></script>
<script type="text/babel" src="MembershipScreen.jsx"></script>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
function App(){
  const [view,setView]=React.useState("home");
  const [product,setProduct]=React.useState(null);
  const [toast,setToast]=React.useState(null);
  const activeNav = view==="membership" ? "Collections" : "Men";
  const go=(v)=>{setView(v);window.scrollTo(0,0);};
  const openProduct=(p)=>{setProduct(p);go("pdp");};
  React.useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),2200); return ()=>clearTimeout(t); },[toast]);
  return (<Shell active={activeNav} onNavigate={(item)=>go(item==="Collections"?"membership":item==="Men"?"home":"listing")}>
    {view==="home" && <HomeScreen onOpenListing={()=>go("listing")} onOpenProduct={openProduct}/>}
    {view==="listing" && <ListingScreen onOpenProduct={openProduct}/>}
    {view==="pdp" && <ProductScreen product={product} onAdded={(p)=>setToast(p.name+" added to bag")}/>}
    {view==="membership" && <MembershipScreen/>}
    {toast && <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"var(--ink)",color:"var(--canvas)",padding:"12px 24px",borderRadius:"var(--radius-pill)",fontSize:"var(--button-sm-size)",fontWeight:500}}>{toast}</div>}
  </Shell>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
